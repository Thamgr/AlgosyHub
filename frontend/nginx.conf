server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # LLM-запросы (генерация подсказок) могут идти десятки секунд,
        # дефолтных 60s nginx-у мало. Backend сам ограничивает свой
        # OpenAI-клиент через OPENAI_TIMEOUT, поэтому ставим запас.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
